<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title :text="$page.title"></title>
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <meta name="description" :content="$page.custom.get('description')">
  <link rel="canonical" :href="$page.link()">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="otp-migrate.sccl.cc">
  <meta property="og:title" :content="$page.title">
  <meta property="og:description" :content="$page.custom.get('description')">
  <meta property="og:url" :content="$page.link()">

  <meta name="twitter:title" :content="$page.title">
  <meta name="twitter:description" :content="$page.custom.get('description')">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--nord0:#2e3440;--nord1:#3b4252;--nord3:#4c566a;--nord4:#d8dee9;--nord8:#88c0d0;--nord11:#bf616a;--nord14:#a3be8c;--nord15:#b48ead;--bg:var(--nord0);--fg:var(--nord4);--fg-dim:var(--nord3)}
    html{background:var(--bg);color:var(--fg);font-family:"Space Mono",monospace;font-size:clamp(14px,1.2vw,24px);line-height:1.6;-webkit-font-smoothing:none;font-smooth:never}
    body{background:var(--bg);min-height:100vh}
    main{min-height:100vh;padding:1.875rem 1.25rem;display:flex;align-items:center;justify-content:center;position:relative;z-index:10}
    ::selection{background:var(--nord8);color:#000}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--fg-dim)}
    *:focus-visible{outline:2px solid var(--nord8);outline-offset:2px}
    .card{width:min(80vw,60rem);background:var(--nord1);padding:1.25rem;border:2px solid var(--nord8)}
    .card-header{margin-bottom:1.25rem;padding-bottom:0.9375rem;border-bottom:1px solid var(--nord8)}
    .header-info{display:flex;flex-direction:column;flex:1}
    .user{color:var(--nord8);font-size:1.25rem;font-weight:700}
    .bio{color:var(--fg);font-size:1rem}
    .card-footer{margin-top:1.25rem;padding-top:0.625rem;border-top:1px solid var(--nord8);display:flex;justify-content:space-between;align-items:center;font-size:1rem;color:var(--fg)}
    .zine-credit{color:var(--fg-dim);text-decoration:none;font-size:0.75rem}
    .zine-credit:hover{color:var(--nord8)}
    .symbol{color:var(--nord8)}
    @media(max-width:767px){html{font-size:14px}.card{width:95vw;padding:0.625rem}.card-header{text-align:center}.card-footer{font-size:0.875rem;flex-direction:column;gap:0.5rem;text-align:center}}

    #drop-zone{border:2px dashed var(--nord3);padding:2rem;text-align:center;cursor:pointer;margin-bottom:1rem;transition:border-color .2s}
    #drop-zone:hover,#drop-zone.drag-over{border-color:var(--nord8);background:rgba(136,192,208,.05)}
    #drop-zone .hint{color:var(--fg-dim);font-size:.875rem;margin-top:.5rem}
    .section-title{color:var(--nord8);font-size:1rem;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--nord8)}
    .btn{background:transparent;color:var(--nord8);border:1px solid var(--nord8);padding:.4rem 1rem;cursor:pointer;font-family:"Space Mono",monospace;font-size:.875rem;transition:all .2s}
    .btn:hover{background:var(--nord8);color:#000}
    .btn:active{opacity:.7}
    .btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
    .btn-small{font-size:.75rem;padding:.2rem .5rem}
    #url-input{width:100%;background:var(--nord0);color:var(--fg);border:1px solid var(--nord3);padding:.5rem;font-family:"Space Mono",monospace;font-size:.875rem;margin-bottom:1rem}
    #url-input:focus{outline:none;border-color:var(--nord8)}
    #url-input::placeholder{color:var(--fg-dim)}
    #accounts{display:flex;flex-direction:column;gap:1rem}
    .account-card{background:var(--nord0);border:1px solid var(--nord3);padding:1rem}
    .account-card:hover{border-color:var(--nord8)}
    .account-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--nord3)}
    .account-issuer{color:var(--nord8);font-weight:700;font-size:1rem}
    .account-name{color:var(--fg);font-size:.875rem}
    .account-field{margin-bottom:.5rem;display:flex;flex-direction:column;gap:.25rem}
    .account-label{color:var(--fg-dim);font-size:.75rem;text-transform:uppercase}
    .account-value{color:var(--fg);font-size:.875rem;word-break:break-all}
    .account-secret{font-family:"Space Mono",monospace;background:var(--nord1);padding:.35rem .5rem;border:1px solid var(--nord3);display:flex;justify-content:space-between;align-items:center}
    .account-secret code{word-break:break-all;font-size:.8rem}
    .account-uri{font-size:.7rem;color:var(--fg-dim);word-break:break-all;font-family:"Space Mono",monospace;background:var(--nord1);padding:.35rem .5rem;border:1px solid var(--nord3)}
    .account-actions{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap;align-items:center}
    .account-qr{margin-top:.75rem;text-align:center}
    .account-qr canvas{border:1px solid var(--nord3);background:#fff}
    .copy-ok{color:var(--nord14)!important}
    .error-msg{color:var(--nord11)}
    .hint{color:var(--fg-dim);font-size:.75rem;margin-top:.25rem}
    #result{display:none}
    #result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    #result-count{color:var(--nord8);font-size:1rem}
    .account-meta{display:flex;gap:1rem;font-size:.75rem;color:var(--fg-dim);margin-bottom:.5rem}
    .account-meta span{display:flex;align-items:center;gap:.25rem}
    .tag{display:inline-block;font-size:.65rem;color:var(--nord14);border:1px solid var(--nord3);border-radius:3px;padding:0 .35rem;margin:0 .15rem .2rem 0}
    #qr-drop{position:relative}
    #qr-drop canvas{display:none}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="card-header">
        <div class="header-info">
          <span class="user">otp-migrate.sccl.cc</span>
          <p class="bio">decode Google Authenticator migration QR codes</p>
          <p class="hint" style="margin-top:.25rem">the otpauth-migration:// format is google-specific. this tool converts it into standard otpauth:// keys for any authenticator app.</p>
        </div>
      </div>
      <div class="card-content">
        <div :html="$page.content()"></div>
      </div>
      <div class="card-footer">
        <span>all processing happens in ur browser. nothing leaves ur device.</span>
        <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
          <a href="https://github.com/scclie/otp-migrate" class="zine-credit" target="_blank">source</a>
          <a href="https://zine-ssg.io" class="zine-credit" target="_blank">built with zig zine</a>
        </div>
        <a href="https://sccl.cc" class="symbol" target="_blank" style="text-decoration:none">sccl.cc</a>
      </div>
    </div>
  </main>
</body>
</html>
